<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistik | Skandale.dk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- Navbar loaded dynamically via navbar.js for consistent mobile menu -->

    <!-- Header -->
    <div class="bg-white border-b">
        <div class="max-w-7xl mx-auto px-6 py-8">
            <h1 class="text-4xl font-bold tracking-tight">Statistik</h1>
            <p class="text-slate-600 mt-1">Overblik over skandaler, støtte og troværdighed på tværs af danske politikere</p>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-6 py-8">

        <!-- Loading -->
        <div id="loading" class="flex justify-center py-16">
            <div class="text-center">
                <i class="fa-solid fa-chart-bar text-4xl text-slate-300 mb-4"></i>
                <p class="text-slate-500">Indlæser statistik...</p>
            </div>
        </div>

        <!-- Content -->
        <div id="content" class="hidden space-y-10">

            <!-- Oversigt -->
            <div>
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-x-2">
                    <i class="fa-solid fa-chart-pie text-[#C8102E]"></i>
                    <span>Oversigt</span>
                </h2>
                <div id="overview" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
            </div>

            <!-- Skandaler per parti -->
            <div>
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-x-2">
                    <i class="fa-solid fa-users text-[#C8102E]"></i>
                    <span>Skandaler per parti</span>
                </h2>
                <div id="by-party" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>

            <!-- Mest økonomisk støttede -->
            <div>
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-x-2">
                    <i class="fa-solid fa-hand-holding-usd text-[#C8102E]"></i>
                    <span>Mest økonomisk støttede politikere</span>
                </h2>
                <div id="support-ranking" class="bg-white rounded-3xl border border-slate-200 divide-y"></div>
            </div>

            <!-- Flest brudte valgløfter -->
            <div>
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-x-2">
                    <i class="fa-solid fa-link-slash text-[#C8102E]"></i>
                    <span>Flest brudte valgløfter</span>
                </h2>
                <div id="broken-promises-ranking" class="bg-white rounded-3xl border border-slate-200 divide-y"></div>
            </div>

            <!-- Mest alvorlige skandaler -->
            <div>
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-x-2">
                    <i class="fa-solid fa-exclamation-triangle text-[#C8102E]"></i>
                    <span>Mest alvorlige skandaler</span>
                </h2>
                <div id="severe-scandals" class="bg-white rounded-3xl border border-slate-200 divide-y"></div>
            </div>

        </div>
    </div>

    <script src="js/navbar.js"></script>
    <script src="js/data.js"></script>
    <script src="js/version.js"></script>

    <script>
        async function loadAndRenderStats() {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');

            try {
                if (typeof loadPoliticians === 'function') {
                    await loadPoliticians();
                }

                // Load detailed data (scandals, economicSupport, brokenPromises etc.)
                if (typeof loadAllPoliticianDetails === 'function') {
                    await loadAllPoliticianDetails();
                }

                const politicians = window.politicians || [];
                if (politicians.length === 0) {
                    loading.innerHTML = '<p class="text-red-500">Kunne ikke indlæse data.</p>';
                    return;
                }

                renderOverview(politicians);
                renderPartyStats(politicians);
                renderSupportRanking(politicians);
                renderBrokenPromisesRanking(politicians);
                renderSevereScandals(politicians);

                loading.classList.add('hidden');
                content.classList.remove('hidden');

            } catch (e) {
                console.error(e);
                loading.innerHTML = '<p class="text-red-500">Der opstod en fejl ved indlæsning af statistik.</p>';
            }
        }

        function renderOverview(politicians) {
            let totalScandals = 0;
            let totalSeverity = 0;
            let severityCount = 0;
            const parties = new Set();

            politicians.forEach(p => {
                parties.add(p.party);
                const scandals = p.scandals || [];
                totalScandals += scandals.length;

                scandals.forEach(s => {
                    const sev = s.ourSeverity || s.severity || 3;
                    totalSeverity += sev;
                    severityCount++;
                });
            });

            const avg = severityCount > 0 ? (totalSeverity / severityCount).toFixed(1) : '0.0';

            document.getElementById('overview').innerHTML = `
                <div class="bg-white rounded-3xl p-6 border border-slate-200">
                    <div class="text-sm text-slate-500">Antal skandaler</div>
                    <div class="text-4xl font-bold mt-1">${totalScandals}</div>
                </div>
                <div class="bg-white rounded-3xl p-6 border border-slate-200">
                    <div class="text-sm text-slate-500">Gennemsnitlig alvorlighed</div>
                    <div class="text-4xl font-bold mt-1">${avg} <span class="text-lg">/ 5</span></div>
                </div>
                <div class="bg-white rounded-3xl p-6 border border-slate-200">
                    <div class="text-sm text-slate-500">Antal politikere</div>
                    <div class="text-4xl font-bold mt-1">${politicians.length}</div>
                </div>
                <div class="bg-white rounded-3xl p-6 border border-slate-200">
                    <div class="text-sm text-slate-500">Antal partier</div>
                    <div class="text-4xl font-bold mt-1">${parties.size}</div>
                </div>
            `;
        }

        function renderPartyStats(politicians) {
            const stats = {};
            politicians.forEach(p => {
                if (!stats[p.party]) {
                    stats[p.party] = { count: 0, color: p.partyColor || '#64748b' };
                }
                stats[p.party].count += (p.scandals || []).length;
            });

            const sorted = Object.entries(stats).sort((a, b) => b[1].count - a[1].count);
            let html = '';

            sorted.forEach(([party, data]) => {
                html += `
                    <div class="bg-white rounded-3xl p-5 border border-slate-200 flex justify-between items-center">
                        <div>
                            <div class="font-semibold">${party}</div>
                            <div class="text-xs text-slate-500">${data.count} skandaler</div>
                        </div>
                        <div class="text-3xl font-bold" style="color: ${data.color}">${data.count}</div>
                    </div>
                `;
            });

            document.getElementById('by-party').innerHTML = html;
        }

        function renderSupportRanking(politicians) {
            const ranking = [];

            politicians.forEach(p => {
                let total = 0;
                if (p.economicSupport && Array.isArray(p.economicSupport)) {
                    p.economicSupport.forEach(d => {
                        const amount = parseInt(String(d.amount || 0).replace(/[^0-9]/g, '')) || 0;
                        total += amount;
                    });
                }
                if (total > 0) {
                    ranking.push({ name: p.name, party: p.party, total });
                }
            });

            ranking.sort((a, b) => b.total - a.total);

            let html = '';
            ranking.slice(0, 8).forEach((item, i) => {
                html += `
                    <div class="px-6 py-4 flex justify-between items-center">
                        <div>
                            <span class="font-medium">${item.name}</span>
                            <span class="text-xs text-slate-400 ml-2">(${item.party})</span>
                        </div>
                        <div class="font-semibold">${(item.total / 1000000).toFixed(1)} mio. kr</div>
                    </div>
                `;
            });

            document.getElementById('support-ranking').innerHTML = html || '<div class="p-6 text-slate-500">Ingen data</div>';
        }

        function renderBrokenPromisesRanking(politicians) {
            const ranking = politicians
                .map(p => ({
                    name: p.name,
                    party: p.party,
                    count: (p.brokenPromises || []).length
                }))
                .filter(x => x.count > 0)
                .sort((a, b) => b.count - a.count);

            let html = '';
            ranking.slice(0, 8).forEach((item, i) => {
                html += `
                    <div class="px-6 py-4 flex justify-between items-center">
                        <div>
                            <span class="font-medium">${item.name}</span>
                            <span class="text-xs text-slate-400 ml-2">(${item.party})</span>
                        </div>
                        <div class="font-semibold">${item.count} løfter</div>
                    </div>
                `;
            });

            document.getElementById('broken-promises-ranking').innerHTML = html || '<div class="p-6 text-slate-500">Ingen brudte løfter registreret</div>';
        }

        function renderSevereScandals(politicians) {
            const list = [];

            politicians.forEach(p => {
                (p.scandals || []).forEach(s => {
                    const sev = s.ourSeverity || s.severity || 0;
                    if (sev >= 4) {
                        list.push({
                            title: s.title,
                            sev: sev,
                            politician: p.name,
                            party: p.party
                        });
                    }
                });
            });

            list.sort((a, b) => b.sev - a.sev);

            let html = '';
            list.slice(0, 6).forEach(item => {
                html += `
                    <div class="px-6 py-4">
                        <div class="flex justify-between">
                            <span class="font-medium">${item.title}</span>
                            <span class="font-semibold text-[#C8102E]">${item.sev}/5</span>
                        </div>
                        <div class="text-xs text-slate-500 mt-1">${item.politician} (${item.party})</div>
                    </div>
                `;
            });

            document.getElementById('severe-scandals').innerHTML = html || '<div class="p-6 text-slate-500">Ingen alvorlige skandaler</div>';
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadAndRenderStats();
        });
    </script>

</body>
</html>
