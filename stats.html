<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistik • Skandale.dk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/dark-mode.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');
        
        :root { --primary: #c8102e; }
        .dark { color-scheme: dark; }
        
        .stat-card {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        
        .skeleton {
            background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .dark .skeleton {
            background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%);
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

    <!-- Navbar indlæses via js/navbar.js -->

    <!-- Hero / Header -->
    <div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="max-w-3xl">
                <div class="flex items-center gap-x-3 mb-4">
                    <div class="px-3 py-1 bg-red-100 dark:bg-red-950 text-red-600 dark:text-red-400 text-sm font-semibold rounded-full">Overblik</div>
                </div>
                <h1 class="text-4xl md:text-5xl font-bold tracking-tight">Statistik & Overblik</h1>
                <p class="mt-3 text-lg text-gray-600 dark:text-gray-400">Få et hurtigt overblik over skandaler, brudte løfter og økonomisk støtte på tværs af dansk politik.</p>
                
                <div class="flex items-center gap-x-4 mt-6">
                    <button onclick="exportToPDF()" 
                            class="inline-flex items-center gap-x-2 px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white text-sm font-semibold rounded-2xl transition-colors">
                        <i class="fa-solid fa-file-pdf"></i>
                        <span>Eksporter til PDF</span>
                    </button>
                    <button onclick="loadAllStatsData()" 
                            class="inline-flex items-center gap-x-2 px-4 py-2.5 border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm font-medium rounded-2xl transition-colors">
                        <i class="fa-solid fa-sync-alt"></i>
                        <span>Opdater data</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Nøgletal -->
        <div class="mb-8">
            <h2 class="text-2xl font-bold mb-4">Nøgletal</h2>
            <div id="metricsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                <!-- Indlæses dynamisk via stats-render.js -->
            </div>
        </div>

        <!-- Parti filter -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-2xl font-bold">Filtrer efter parti</h2>
                <button onclick="resetPartyFilter()" class="text-red-600 hover:text-red-700 text-sm flex items-center gap-1">
                    <i class="fa-solid fa-times"></i> Nulstil
                </button>
            </div>
            <div id="partyFilterBar" class="flex flex-wrap gap-2">
                <!-- Indlæses dynamisk -->
            </div>
        </div>

        <!-- Skandaler pr. parti + Top 5 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-3xl p-6">
                <h3 class="font-bold text-lg mb-4">Skandaler per parti</h3>
                <div id="partyDistribution" class="space-y-4"></div>
            </div>

            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-3xl p-6">
                <h3 class="font-bold text-lg mb-4">Top 5 mest skandale-ramte</h3>
                <div id="topScandals" class="space-y-3"></div>
            </div>
        </div>

        <!-- Andre sektioner (kan udvides senere) -->
        <div class="mt-8 text-center text-sm text-gray-500 dark:text-gray-400">
            Senest opdateret: <span id="lastUpdated"></span>
        </div>

    </div>

    <footer class="border-t border-gray-200 dark:border-gray-700 mt-12 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500 dark:text-gray-400">
            <p>Skandale.dk — Skabt for større gennemsigtighed i dansk politik.</p>
        </div>
    </footer>

    <!-- 
        Modal scripts (samme rækkefølge som på netværk-siden + nødvendige for politiker-modal)
        Skal indlæses FØR stats-scriptene, så window.showPoliticianModal findes allerede
    -->
    <script src="js/version.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/site-stats.js"></script>
    <script src="js/data.js"></script>
    <script src="js/modal-core.js"></script>
    <script src="js/modal-scandal.js"></script>
    <script src="js/modal-comments.js"></script>
    <script src="js/modal-donor.js"></script>
    <script src="js/modal-affiliations.js"></script>
    <script src="js/modal-broken-promises.js"></script>

    <!-- Stats scripts -->
    <script src="js/stats/stats-data.js"></script>
    <script src="js/stats/stats-render.js"></script>
    <script src="js/stats/stats-filters.js"></script>
    <script src="js/stats/stats-pdf.js"></script>
    <script src="js/stats/stats-init.js"></script>
</body>
</html>
