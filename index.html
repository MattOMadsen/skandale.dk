    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">

    <script src="js/dark-mode.js"></script>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">

    <!-- Navbar bliver nu indlæst dynamisk via js/navbar.js -->

    <!-- Hero -->
    <div class="fm-intro">
        <div class="max-w-5xl mx-auto px-6">
            <p class="fm-intro__kicker" id="site-updated-label">Opdateret …</p>
            <h1>Gennemsigtighed i dansk politik</h1>
            <p>Skandaler, støtte, netværk og brudte løfter — samlet ét sted.</p>

            <!-- Hurtig statistik -->
            <div id="stats-snapshot" class="max-w-4xl mx-auto mb-10">
                <!-- Indhold genereres af js/stats-snapshot.js -->
            </div>

            <!-- Søgefelt -->
            <div class="max-w-md">
                <div class="relative">
                    <input id="searchInput" type="text" placeholder="Søg efter politiker…"
                           onkeyup="if (typeof filterPoliticians === 'function') filterPoliticians()"
                           class="fm-search">
                    <i class="fa-solid fa-search absolute right-4 top-3.5 text-[#8b918c]"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Politikere sektion -->
    <div id="politicians-section" class="max-w-7xl mx-auto px-6 py-12">
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6">
            <div>
                <h2 class="text-3xl font-bold tracking-tight">Politikere</h2>
                <p class="text-slate-600 dark:text-slate-400">Klik på en politiker for at se detaljer, skandaler og vurderinger</p>
            </div>
            <div id="politician-count" class="text-sm text-slate-500 dark:text-slate-400 shrink-0"></div>
        </div>

        <div class="flex flex-col gap-4 mb-6">
            <div id="folketing-filter" class="inline-flex self-start rounded-full border border-slate-200 dark:border-slate-700 p-1 bg-slate-100 dark:bg-slate-800">
                <button data-folketing="folketing" class="folketing-chip active shrink-0 px-5 py-2 text-sm font-medium rounded-full transition-all bg-[#C8102E] text-white shadow-sm">
                    Folketinget nu
                </button>
                <button data-folketing="all" class="folketing-chip shrink-0 px-5 py-2 text-sm font-medium rounded-full transition-all text-slate-700 dark:text-slate-300 hover:bg-white/60 dark:hover:bg-slate-700/60">
                    Alle politikere
                </button>
            </div>
            <div id="party-filter-chips"></div>
        </div>

        <div id="politiciansGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Politikere indsættes dynamisk via js/ui.js -->
        </div>

        <div id="scroll-sentinel" class="h-px w-full" aria-hidden="true"></div>

        <!-- Infinite Scroll Loader (ny) -->
        <div id="infinite-scroll-loader" class="hidden justify-center items-center py-8">
            <div class="flex items-center gap-x-3 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-[#C8102E]"></i>
                <span class="text-sm">Indlæser flere politikere...</span>
            </div>
        </div>

        <!-- Besked når alle er vist -->
        <div id="all-politicians-shown" class="hidden text-center py-6 text-sm text-slate-500">
            Alle politikere er vist.
        </div>
    </div>

    <script src="js/main.js?v=2026-06-19"></script>

    <!-- Sikkerhedsnet + Robust auto-open fra sammenlign.html -->
    <script>
        function tryOpenPoliticianFromStorage(attempt = 1) {
            const maxAttempts = 8;
            const politicianIdRaw = localStorage.getItem('openPoliticianOnLoad');

            if (!politicianIdRaw) return;

            const politicianId = parseInt(politicianIdRaw, 10);

            const hasData = typeof window.politicians !== 'undefined' && Array.isArray(window.politicians) && window.politicians.length > 0;
            const openFn = window.openPoliticianModal || window.showPoliticianModal;

            if (hasData && typeof openFn === 'function') {
                try {
                    openFn(politicianId);
                    localStorage.removeItem('openPoliticianOnLoad');
                    console.log('%c[Skandale.dk] Auto-åbnede politiker: ' + politicianId, 'color:#10b981');
                    return;
                } catch (e) {
                    console.error('Fejl ved kald af open/showPoliticianModal:', e);
                }
            }

            if (attempt < maxAttempts) {
                const delay = 250 * attempt;
                setTimeout(() => tryOpenPoliticianFromStorage(attempt + 1), delay);
            } else {
                localStorage.removeItem('openPoliticianOnLoad');
                console.warn('Kunne ikke auto-åbne politiker efter ' + maxAttempts + ' forsøg.');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            tryOpenPoliticianFromStorage();
        });
    </script>

    <script src="js/pwa.js?v=2026-06-19"></script>
    <script src="js/navbar.js?v=2026-06-19"></script>
