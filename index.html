<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skandale.dk - Alle skandaler. Én oversigt.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900">

<!-- Navbar -->
<nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-x-3">
            <div class="w-9 h-9 bg-[#C8102E] rounded-2xl flex items-center justify-center">
                <i class="fa-solid fa-balance-scale text-white text-xl"></i>
            </div>
            <div>
                <div class="font-bold text-2xl tracking-tighter">Skandale.dk</div>
                <div class="text-[10px] text-slate-400 -mt-1">Politisk gennemsigtighed</div>
            </div>
        </div>
        
        <div class="hidden md:flex items-center gap-x-8 text-sm font-medium">
            <a href="#" onclick="document.getElementById('politiciansGrid').scrollIntoView({ behavior: 'smooth' })" class="text-slate-600 hover:text-[#C8102E] transition-colors">Forside</a>
            <a href="#" onclick="if (typeof showTimelineModal === 'function') showTimelineModal(); else alert('Tidslinje åbnes snart')" class="text-slate-600 hover:text-[#C8102E] transition-colors">Tidslinje</a>
            <a href="#" onclick="if (typeof showCompareModal === 'function') showCompareModal(); else alert('Sammenlign åbnes snart')" class="text-slate-600 hover:text-[#C8102E] transition-colors">Sammenlign</a>
            <a href="#" onclick="if (typeof showStatsModal === 'function') showStatsModal(); else alert('Statistik åbnes snart')" class="text-slate-600 hover:text-[#C8102E] transition-colors">Statistik</a>
            <a href="#" class="text-slate-600 hover:text-[#C8102E] transition-colors">Om projektet</a>
        </div>

        <!-- Mobile menu button -->
        <div class="md:hidden">
            <button class="text-slate-600 hover:text-slate-900">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
        </div>

        <div class="hidden md:block px-3 py-1 bg-slate-100 rounded-full text-xs font-medium text-slate-500" id="navbar-version"></div>
    </div>
</nav>

<!-- Hero med søgefelt -->
<div class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white">
    <div class="max-w-5xl mx-auto px-6 pt-16 pb-20 text-center">
        <div class="inline-flex items-center gap-x-2 bg-white/10 backdrop-blur-md px-4 py-1.5 rounded-full mb-6 text-sm">
            <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
            <span class="font-medium"><span id="app-version-hero"></span> • 12 politikere</span>
        </div>
        
        <h1 class="text-5xl md:text-7xl font-bold tracking-tighter heading-font mb-6">
            Alle skandaler.<br>Én oversigt.
        </h1>
        
        <p class="max-w-2xl mx-auto text-xl text-slate-300 mb-10">
            Søg på en politiker – se skandaler, støtte og hvad der burde være sket.
        </p>

        <!-- Søgefelt -->
        <div class="max-w-xl mx-auto relative">
            <input id="searchInput" 
                   type="text" 
                   placeholder="Søg efter politiker..." 
                   class="search-input w-full bg-white text-slate-900 border border-white/20 focus:border-[#C8102E] px-6 py-4 pl-14 rounded-3xl text-lg shadow-xl outline-none"
                   onkeyup="filterPoliticians()">
            <i class="fa-solid fa-search absolute left-6 top-4.5 text-xl text-slate-400"></i>
        </div>
    </div>
</div>

<!-- Politikere grid -->
<div class="max-w-7xl mx-auto px-6 py-16">
    <h2 class="text-4xl font-bold tracking-tight text-slate-900 mb-8">Kendte politikere</h2>
    <div id="politiciansGrid" 
         class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <!-- Politikerkort indsættes her via JavaScript -->
    </div>
</div>

<!-- Scripts -->
<script src="js/version.js"></script>
<script src="js/modal-core.js"></script>
<script src="js/modal-scandal.js"></script>
<script src="js/modal-voting.js"></script>
<script src="js/modal-comments.js"></script>
<script src="js/modal-donor.js"></script>
<script src="js/data.js"></script>
<script src="js/search.js"></script>
<script src="js/ui.js"></script>
<script src="js/timeline.js"></script>
<script src="js/main.js"></script>
<script src="js/modal-broken-promises.js"></script>
<script src="js/modal-share.js"></script>
<script src="js/modal-party.js"></script>
<script src="js/modal-compare.js"></script>
<script src="js/modal-stats.js"></script>
<script src="js/modal-pdf-export.js"></script>

<!-- jsPDF CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
    function setVersion() {
        if (typeof APP_VERSION !== 'undefined') {
            const ids = ['app-version', 'app-version-hero', 'app-version-footer'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = APP_VERSION;
            });
            
            const navbar = document.getElementById('navbar-version');
            if (navbar) navbar.textContent = APP_VERSION + " Split";
        }
    }
    
    window.onload = function() {
        if (typeof initializeEverything === 'function') {
            initializeEverything();
        }
        setVersion();
        setTimeout(setVersion, 500);
    };
</script>

</body>
</html>
