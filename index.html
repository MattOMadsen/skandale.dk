<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skandale.dk – Politisk gennemsigtighed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <script src="js/dark-mode.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">

    <!-- Navbar loaded dynamically via js/navbar.js for consistent menu across all pages -->

    <div class="max-w-7xl mx-auto px-6 pt-8 pb-4">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-4xl font-bold tracking-tight">Skandale.dk</h1>
                <p class="text-slate-600 mt-1">Politisk gennemsigtighed – skandaler, støtte, netværk og brudte løfter</p>
            </div>
            <div class="hidden md:block text-sm text-slate-500">
                <span id="politician-count">12</span> politikere
            </div>
        </div>
    </div>

    <!-- Search -->
    <div class="max-w-7xl mx-auto px-6 pb-6">
        <div class="relative">
            <i class="fa-solid fa-search absolute left-6 top-4 text-slate-400"></i>
            <input id="searchInput" type="text" placeholder="Søg efter politiker..." 
                   onkeyup="if (typeof filterPoliticians === 'function') filterPoliticians()"
                   class="w-full bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 placeholder-slate-400 border-0 rounded-3xl px-6 py-4 text-lg focus:outline-none focus:ring-2 focus:ring-[#C8102E]">
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-6 pb-12">
        <div id="politicians-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Populated by JS -->
        </div>
    </div>

    <script src="js/navbar.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/search.js"></script>
    <script src="js/skeleton-loader.js"></script>

    <script>
        // Infinite scroll state
        let visibleCount = 8;
        let allPoliticians = [];
        let filteredPoliticians = [];

        async function initHomepage() {
            if (typeof loadPoliticians === 'function') {
                await loadPoliticians();
            }

            allPoliticians = window.politicians || [];
            filteredPoliticians = [...allPoliticians];

            renderPoliticians();

            // Update count
            const countEl = document.getElementById('politician-count');
            if (countEl) countEl.textContent = allPoliticians.length;

            // Infinite scroll
            window.addEventListener('scroll', () => {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 300) {
                    if (visibleCount < filteredPoliticians.length) {
                        visibleCount += 4;
                        renderPoliticians();
                    }
                }
            });
        }

        function renderPoliticians() {
            const grid = document.getElementById('politicians-grid');
            if (!grid) return;

            grid.innerHTML = '';

            const toShow = filteredPoliticians.slice(0, visibleCount);

            toShow.forEach(p => {
                const card = document.createElement('div');
                card.className = 'politician-card bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl p-6 cursor-pointer hover:border-[#C8102E]/40 transition-all';
                card.onclick = () => {
                    if (typeof window.showPoliticianModal === 'function') {
                        window.showPoliticianModal(p.id);
                    }
                };

                const avatarColor = p.avatarColor || p.partyColor || '#C8102E';
                const initials = p.initials || p.name.split(' ').map(n => n[0]).join('');

                card.innerHTML = `
                    <div class="flex items-start gap-x-4">
                        <div class="w-14 h-14 rounded-2xl flex-shrink-0 flex items-center justify-center text-white text-2xl font-bold shadow-sm" style="background-color: ${avatarColor}">
                            ${initials}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="font-semibold text-xl">${p.name}</div>
                            <div class="text-xs text-slate-400 dark:text-slate-500">${p.party}</div>
                            
                            <div class="mt-3 flex items-center gap-x-2">
                                <span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">${p.scandals ? p.scandals.length : 0} skandaler</span>
                            </div>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function filterPoliticians() {
            const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            
            if (!q) {
                filteredPoliticians = [...allPoliticians];
            } else {
                filteredPoliticians = allPoliticians.filter(p => 
                    p.name.toLowerCase().includes(q) || 
                    (p.party && p.party.toLowerCase().includes(q))
                );
            }

            visibleCount = 8;
            renderPoliticians();
        }

        document.addEventListener('DOMContentLoaded', initHomepage);
    </script>
</body>
</html>
