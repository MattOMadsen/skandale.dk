<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidslinje | Skandale.dk – Politisk gennemsigtighed</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <script src="js/dark-mode.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">

    <!-- Navbar loaded dynamically via js/navbar.js for consistent menu across all pages (refreshed commit) -->

    <div class="max-w-7xl mx-auto px-6 pt-8 pb-4">
        <h1 class="text-4xl font-bold tracking-tight">Tidslinje over politiske skandaler</h1>
        <p class="mt-2 text-slate-600 dark:text-slate-400">Filtrer, søg og se skandaler grupperet efter år</p>
    </div>

    <div class="max-w-7xl mx-auto px-6 pb-6">
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl p-6 space-y-4">
            <div>
                <label class="text-xs font-medium text-slate-500 dark:text-slate-400 block mb-1">Søg</label>
                <input id="searchInput" type="text" placeholder="Søg i titel eller beskrivelse..." onkeyup="filterTimeline()" class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#C8102E]/30">
            </div>
            <div class="flex flex-wrap gap-4">
                <div class="flex-1 min-w-[160px]">
                    <label class="text-xs font-medium text-slate-500 dark:text-slate-400 block mb-1">Parti</label>
                    <select id="filterParty" onchange="filterTimeline()" class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 rounded-2xl px-4 py-2 text-sm">
                        <option value="">Alle partier</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[160px]">
                    <label class="text-xs font-medium text-slate-500 dark:text-slate-400 block mb-1">Minimum alvorlighed</label>
                    <select id="filterSeverity" onchange="filterTimeline()" class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 rounded-2xl px-4 py-2 text-sm">
                        <option value="">Alle</option>
                        <option value="1">1+ stjerner</option>
                        <option value="2">2+</option>
                        <option value="3">3+</option>
                        <option value="4">4+</option>
                        <option value="5">5 stjerner</option>
                    </select>
                </div>
                <div class="pt-6">
                    <button onclick="resetFilters()" class="px-5 py-2 text-sm border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-700">Nulstil</button>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-6 pb-12">
        <div id="timelineContent" class="space-y-8">
            <div class="text-center py-10 text-slate-500">Indlæser tidslinje...</div>
        </div>
    </div>

    <script src="js/version.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/site-stats.js"></script>
    <script src="js/data.js"></script>
    <script src="js/modal-helpers.js"></script>
    <script src="js/modal-scandal.js"></script>
    <script src="js/modal-core.js"></script>

    <script>
        let allScandals = [];

        function normalizeTimelineItem(sc) {
            const year = sc.year || (sc.date && String(sc.date).match(/\d{4}/g)?.slice(-1)[0]) || null;
            const severity = sc.ourSeverity ?? sc.severity ?? 3;
            return {
                ...sc,
                year,
                severity,
                shortDesc: sc.shortDesc || sc.description || sc.longDesc || ''
            };
        }

        function createStars(severity) {
            let html = '';
            const num = parseInt(severity) || 0;
            for (let i = 1; i <= 5; i++) {
                html += i <= num
                    ? '<i class="fa-solid fa-star text-yellow-400"></i>'
                    : '<i class="fa-regular fa-star text-slate-300 dark:text-slate-600"></i>';
            }
            return html;
        }

        function filterTimeline() {
            const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const party = document.getElementById('filterParty')?.value || '';
            const minSev = parseInt(document.getElementById('filterSeverity')?.value) || 0;
            let filtered = allScandals.filter(s => {
                const matchSearch = !q || (s.title && s.title.toLowerCase().includes(q)) || (s.shortDesc && s.shortDesc.toLowerCase().includes(q));
                const matchParty = !party || s.party === party;
                const matchSev = !minSev || (s.severity || 0) >= minSev;
                return matchSearch && matchParty && matchSev;
            });
            renderTimeline(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterParty').value = '';
            document.getElementById('filterSeverity').value = '';
            renderTimeline(allScandals);
        }

        function renderTimeline(list) {
            const container = document.getElementById('timelineContent');
            if (!container) return;
            container.innerHTML = '';
            if (!list || list.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-500 dark:text-slate-400 py-8">Ingen skandaler fundet.</p>';
                return;
            }
            const byYear = {};
            list.forEach(item => {
                const y = item.year || 'Ukendt';
                if (!byYear[y]) byYear[y] = [];
                byYear[y].push(item);
            });
            Object.keys(byYear).sort((a,b) => {
                if (a === 'Ukendt') return 1;
                if (b === 'Ukendt') return -1;
                return b.localeCompare(a);
            }).forEach(year => {
                const section = document.createElement('div');
                section.innerHTML = `<div class="flex items-baseline gap-x-3 mb-3"><span class="text-2xl font-semibold text-[#C8102E]">${year}</span><span class="text-sm text-slate-500 dark:text-slate-400">${byYear[year].length} skandaler</span></div>`;
                const grid = document.createElement('div');
                grid.className = 'space-y-3';
                byYear[year].forEach(s => {
                    const displayYear = s.year || year;
                    const el = document.createElement('div');
                    el.className = 'p-5 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-2xl hover:border-[#C8102E]/30 dark:hover:border-[#C8102E]/50 cursor-pointer flex gap-4';
                    el.onclick = () => { if (window.showPoliticianModal) window.showPoliticianModal(s.politicianId); };
                    el.innerHTML = `<div class="w-14 text-center flex-shrink-0"><div class="font-bold text-[#C8102E]">${displayYear}</div><div>${createStars(s.severity)}</div></div><div class="flex-1 min-w-0"><div class="font-semibold text-slate-900 dark:text-slate-100">${s.title}</div><div class="text-sm text-slate-600 dark:text-slate-400 line-clamp-2 mt-0.5">${s.shortDesc || ''}</div><span class="inline-block mt-2 text-xs px-2 py-0.5 rounded-full" style="background:${s.partyColor}20; color:${s.partyColor}">${s.politicianName} • ${s.party}</span></div>`;
                    grid.appendChild(el);
                });
                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        async function loadData() {
            const container = document.getElementById('timelineContent');
            try {
                if (container) container.innerHTML = '<div class="text-center py-10 text-slate-500">Henter skandaler...</div>';

                if (!window.SiteStats) throw new Error('SiteStats ikke indlæst');

                const entries = await SiteStats.loadTimelineEntries();
                allScandals = entries.map(normalizeTimelineItem);
                allScandals.sort((a, b) => (b.year || '').localeCompare(a.year || ''));

                const partySelect = document.getElementById('filterParty');
                if (partySelect) {
                    const unique = [...new Set(allScandals.map(s => s.party))].sort();
                    unique.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p;
                        opt.textContent = p;
                        partySelect.appendChild(opt);
                    });
                }

                renderTimeline(allScandals);

            } catch (err) {
                console.error('Fejl i loadData:', err);
                if (container) {
                    container.innerHTML = `<div class="text-center py-10"><p class="text-red-500">Der opstod en fejl.</p><p class="text-xs text-slate-400 mt-1">${err.message}</p></div>`;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
