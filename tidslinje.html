<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidslinje | Skandale.dk – Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <h1 class="text-2xl mb-6">Debug: Tidslinje</h1>

    <div id="status" class="mb-4 p-4 bg-slate-800 rounded">Starter...</div>
    <div id="result" class="p-4 bg-slate-800 rounded"></div>

    <script src="js/data.js"></script>

    <script>
        async function testLoad() {
            const statusEl = document.getElementById('status');
            const resultEl = document.getElementById('result');

            try {
                statusEl.innerHTML = 'Kalder loadPoliticians()...';

                if (typeof loadPoliticians === 'function') {
                    await loadPoliticians();
                    statusEl.innerHTML = 'loadPoliticians() færdig.';
                } else {
                    statusEl.innerHTML = 'loadPoliticians findes ikke!';
                    return;
                }

                const pols = window.politicians || [];
                resultEl.innerHTML = `<p>Antal politikere loadet: <strong>${pols.length}</strong></p>`;

                if (pols.length > 0) {
                    resultEl.innerHTML += `<p>Første politiker: ${pols[0].name} (${pols[0].party})</p>`;
                    resultEl.innerHTML += `<p>_detailsLoaded: ${pols[0]._detailsLoaded}</p>`;
                }

                // Test loadAllPoliticianDetails
                statusEl.innerHTML = 'Tester loadAllPoliticianDetails...';
                if (typeof loadAllPoliticianDetails === 'function') {
                    await loadAllPoliticianDetails();
                    statusEl.innerHTML = 'loadAllPoliticianDetails færdig.';

                    const after = window.politicians || [];
                    const loaded = after.filter(p => p._detailsLoaded).length;
                    resultEl.innerHTML += `<p>Politikere med detaljer loadet: <strong>${loaded}</strong></p>`;
                }

            } catch (err) {
                statusEl.innerHTML = 'FEJL!';
                resultEl.innerHTML = `<pre class="text-red-400">${err.stack || err.message}</pre>`;
            }
        }

        window.onload = testLoad;
    </script>
</body>
</html>
