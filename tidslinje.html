<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidslinje | Skandale.dk – Politisk gennemsigtighed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- Navbar -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <a href="index.html" class="flex items-center gap-x-3">
                    <div class="w-10 h-10 bg-[#C8102E] rounded-2xl flex items-center justify-center">
                        <i class="fa-solid fa-balance-scale text-white text-2xl"></i>
                    </div>
                    <div>
                        <div class="font-bold text-2xl tracking-tight">Skandale.dk</div>
                        <div class="text-[10px] text-slate-500 -mt-1">Politisk gennemsigtighed</div>
                    </div>
                </a>
            </div>

            <div class="flex items-center gap-x-4">
                <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-[#C8102E] transition-colors flex items-center gap-x-2">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Tilbage til forsiden</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="max-w-7xl mx-auto px-6 pt-10 pb-6">
        <div class="flex items-end justify-between">
            <div>
                <h1 class="text-4xl font-bold tracking-tight">Tidslinje over politiske skandaler</h1>
                <p class="text-lg text-slate-600 mt-2">Oversigt over skandaler sorteret efter år – nyeste først</p>
            </div>
            <div class="hidden md:block text-sm text-slate-500">
                Filtrer efter parti og alvorlighed
            </div>
        </div>
    </div>

    <!-- Filtre -->
    <div class="max-w-7xl mx-auto px-6 pb-6">
        <div class="bg-white border border-slate-200 rounded-3xl p-6 flex flex-wrap gap-4 items-end">
            <div class="flex-1 min-w-[200px]">
                <label class="block text-xs font-medium text-slate-500 mb-1.5">Parti</label>
                <select id="filterParty" onchange="filterTimeline()" 
                        class="w-full border border-slate-300 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#C8102E]/30">
                    <option value="">Alle partier</option>
                </select>
            </div>
            <div class="flex-1 min-w-[200px]">
                <label class="block text-xs font-medium text-slate-500 mb-1.5">Minimum alvorlighed</label>
                <select id="filterSeverity" onchange="filterTimeline()" 
                        class="w-full border border-slate-300 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#C8102E]/30">
                    <option value="">Alle niveauer</option>
                    <option value="1">1+ stjerner</option>
                    <option value="2">2+ stjerner</option>
                    <option value="3">3+ stjerner</option>
                    <option value="4">4+ stjerner</option>
                    <option value="5">5 stjerner</option>
                </select>
            </div>
            <div>
                <button onclick="resetTimelineFilters()" 
                        class="px-6 py-2.5 text-sm font-medium border border-slate-300 hover:bg-slate-100 rounded-2xl transition-colors">
                    Nulstil filtre
                </button>
            </div>
        </div>
    </div>

    <!-- Timeline Content -->
    <div class="max-w-7xl mx-auto px-6 pb-16">
        <div id="timelineContent" class="space-y-4">
            <!-- Indhold indlæses dynamisk -->
            <div class="flex items-center justify-center py-12">
                <div class="text-center">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-[#C8102E] mb-4"></i>
                    <p class="text-slate-500">Indlæser tidslinje...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/timeline.js"></script>

    <script>
        // Initialiser tidslinjen på den dedikerede side
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await loadPoliticians();
                
                // Brug den eksisterende showTimeline logik, men tilpas til fuld side
                const contentContainer = document.getElementById('timelineContent');
                
                if (typeof window.politicians === 'undefined' || !window.politicians.length) {
                    contentContainer.innerHTML = '<p class="text-slate-500 text-center py-8">Kunne ikke indlæse data.</p>';
                    return;
                }

                // Genbrug collect og render fra timeline.js
                if (typeof collectScandalsFromPoliticians === 'function') {
                    collectScandalsFromPoliticians();
                }

                if (typeof allScandals !== 'undefined' && allScandals.length === 0 && typeof window.loadPoliticianDetails === 'function') {
                    // Proaktiv loading
                    const loadPromises = window.politicians.map(p => 
                        !p._detailsLoaded ? window.loadPoliticianDetails(p).catch(() => {}) : Promise.resolve()
                    );
                    await Promise.all(loadPromises);
                    if (typeof collectScandalsFromPoliticians === 'function') collectScandalsFromPoliticians();
                }

                if (typeof allScandals !== 'undefined' && allScandals.length > 0) {
                    allScandals.sort((a, b) => (b.year || '0').localeCompare(a.year || '0'));
                    
                    // Byg parti filter
                    const partySelect = document.getElementById('filterParty');
                    if (partySelect) {
                        partySelect.innerHTML = '<option value="">Alle partier</option>';
                        [...new Set(allScandals.map(s => s.party))].sort().forEach(party => {
                            const opt = document.createElement('option');
                            opt.value = party;
                            opt.textContent = party;
                            partySelect.appendChild(opt);
                        });
                    }

                    if (typeof renderTimeline === 'function') {
                        renderTimeline(allScandals);
                    }
                } else {
                    contentContainer.innerHTML = '<p class="text-slate-500 text-center py-8">Ingen skandaler fundet.</p>';
                }

            } catch (e) {
                console.error(e);
                document.getElementById('timelineContent').innerHTML = 
                    '<p class="text-red-500 text-center py-8">Der opstod en fejl ved indlæsning af tidslinjen.</p>';
            }
        });

        // Gør filter/reset globale så de virker fra HTML
        window.filterTimeline = window.filterTimeline || function() {};
        window.resetTimelineFilters = window.resetTimelineFilters || function() {};
    </script>

</body>
</html>
