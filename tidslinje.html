<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidslinje | Skandale.dk – Politisk gennemsigtighed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- Navbar -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <a href="index.html" class="flex items-center gap-x-3">
                    <div class="w-10 h-10 bg-[#C8102E] rounded-2xl flex items-center justify-center">
                        <i class="fa-solid fa-balance-scale text-white text-2xl"></i>
                    </div>
                    <div>
                        <div class="font-bold text-2xl tracking-tight">Skandale.dk</div>
                        <div class="text-[10px] text-slate-500 -mt-1">Politisk gennemsigtighed</div>
                    </div>
                </a>
            </div>

            <div class="flex items-center gap-x-4">
                <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-[#C8102E] transition-colors flex items-center gap-x-2">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Tilbage til forsiden</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="max-w-7xl mx-auto px-6 pt-10 pb-4">
        <h1 class="text-4xl font-bold tracking-tight">Tidslinje over politiske skandaler</h1>
        <p class="text-lg text-slate-600 mt-2">Oversigt over skandaler sorteret efter år – nyeste først</p>
    </div>

    <!-- Søgning + Filtre -->
    <div class="max-w-7xl mx-auto px-6 pb-6">
        <div class="bg-white border border-slate-200 rounded-3xl p-6 space-y-4">
            
            <!-- Søgefelt -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1.5">Søg i skandaler</label>
                <div class="relative">
                    <input id="searchInput" type="text" placeholder="Søg efter titel eller beskrivelse..." 
                           onkeyup="filterAndRenderTimeline()"
                           class="w-full border border-slate-300 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#C8102E]/30">
                    <i class="fa-solid fa-search absolute right-4 top-3.5 text-slate-400"></i>
                </div>
            </div>

            <!-- Filtre -->
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[180px]">
                    <label class="block text-xs font-medium text-slate-500 mb-1.5">Parti</label>
                    <select id="filterParty" onchange="filterAndRenderTimeline()" 
                            class="w-full border border-slate-300 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#C8102E]/30">
                        <option value="">Alle partier</option>
                    </select>
                </div>
                <div class="flex-1 min-w-[180px]">
                    <label class="block text-xs font-medium text-slate-500 mb-1.5">Minimum alvorlighed</label>
                    <select id="filterSeverity" onchange="filterAndRenderTimeline()" 
                            class="w-full border border-slate-300 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#C8102E]/30">
                        <option value="">Alle niveauer</option>
                        <option value="1">1+ stjerner</option>
                        <option value="2">2+ stjerner</option>
                        <option value="3">3+ stjerner</option>
                        <option value="4">4+ stjerner</option>
                        <option value="5">5 stjerner</option>
                    </select>
                </div>
                <div>
                    <button onclick="resetAllFilters()" 
                            class="px-6 py-2.5 text-sm font-medium border border-slate-300 hover:bg-slate-100 rounded-2xl transition-colors">
                        Nulstil alle filtre
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Timeline Content -->
    <div class="max-w-7xl mx-auto px-6 pb-16">
        <div id="timelineContent" class="space-y-8">
            <!-- Indhold indlæses dynamisk med år-gruppering -->
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/timeline.js"></script>

    <script>
        let allScandals = [];
        let currentFiltered = [];

        function createStars(severity) {
            let html = '';
            const num = parseInt(severity) || 0;
            for (let i = 1; i <= 5; i++) {
                if (i <= num) {
                    html += '<i class="fa-solid fa-star text-yellow-400"></i>';
                } else {
                    html += '<i class="fa-regular fa-star text-slate-300"></i>';
                }
            }
            return html;
        }

        async function initTimelinePage() {
            const container = document.getElementById('timelineContent');
            
            try {
                await loadPoliticians();
                
                const pols = window.politicians || [];
                allScandals = [];

                pols.forEach(politician => {
                    if (politician.scandals && Array.isArray(politician.scandals)) {
                        politician.scandals.forEach(scandal => {
                            allScandals.push({
                                ...scandal,
                                politicianName: politician.name,
                                politicianId: politician.id,
                                party: politician.party,
                                partyColor: politician.partyColor || '#64748b'
                            });
                        });
                    }
                });

                // Sorter nyeste først
                allScandals.sort((a, b) => (b.year || '0').localeCompare(a.year || '0'));
                currentFiltered = [...allScandals];

                // Byg parti-filter
                buildPartyFilter();

                renderGroupedTimeline(currentFiltered);

            } catch (e) {
                console.error(e);
                container.innerHTML = '<p class="text-red-500 text-center py-8">Der opstod en fejl ved indlæsning af tidslinjen.</p>';
            }
        }

        function buildPartyFilter() {
            const select = document.getElementById('filterParty');
            if (!select) return;

            const parties = [...new Set(allScandals.map(s => s.party))].sort();
            select.innerHTML = '<option value="">Alle partier</option>';
            parties.forEach(party => {
                const opt = document.createElement('option');
                opt.value = party;
                opt.textContent = party;
                select.appendChild(opt);
            });
        }

        function filterAndRenderTimeline() {
            const searchTerm = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
            const party = document.getElementById('filterParty')?.value || '';
            const minSeverity = parseInt(document.getElementById('filterSeverity')?.value) || 0;

            let filtered = allScandals;

            if (searchTerm) {
                filtered = filtered.filter(s => 
                    (s.title && s.title.toLowerCase().includes(searchTerm)) || 
                    (s.shortDesc && s.shortDesc.toLowerCase().includes(searchTerm))
                );
            }

            if (party) {
                filtered = filtered.filter(s => s.party === party);
            }

            if (minSeverity > 0) {
                filtered = filtered.filter(s => (s.severity || 0) >= minSeverity);
            }

            currentFiltered = filtered;
            renderGroupedTimeline(filtered);
        }

        function resetAllFilters() {
            const search = document.getElementById('searchInput');
            const party = document.getElementById('filterParty');
            const severity = document.getElementById('filterSeverity');

            if (search) search.value = '';
            if (party) party.value = '';
            if (severity) severity.value = '';

            currentFiltered = [...allScandals];
            renderGroupedTimeline(allScandals);
        }

        function renderGroupedTimeline(scandals) {
            const container = document.getElementById('timelineContent');
            if (!container) return;

            container.innerHTML = '';

            if (!scandals || scandals.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-center py-8">Ingen skandaler matcher dine filtre.</p>';
                return;
            }

            // Grupper efter år
            const grouped = {};
            scandals.forEach(s => {
                const year = s.year || 'Ukendt år';
                if (!grouped[year]) grouped[year] = [];
                grouped[year].push(s);
            });

            // Render grupper (nyeste først)
            const sortedYears = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

            sortedYears.forEach(year => {
                const yearSection = document.createElement('div');
                yearSection.innerHTML = `
                    <div class="flex items-center gap-x-3 mb-4">
                        <div class="text-2xl font-bold text-[#C8102E]">${year}</div>
                        <div class="flex-1 h-px bg-slate-200"></div>
                        <div class="text-sm text-slate-500">${grouped[year].length} skandaler</div>
                    </div>
                `;

                const list = document.createElement('div');
                list.className = 'space-y-3 mb-8';

                grouped[year].forEach(scandal => {
                    const card = document.createElement('div');
                    card.className = 'flex gap-4 p-5 border border-slate-200 rounded-2xl hover:border-[#C8102E]/30 cursor-pointer group transition-all bg-white';
                    card.onclick = () => {
                        if (typeof window.showPoliticianModal === 'function') {
                            window.showPoliticianModal(scandal.politicianId);
                        }
                    };

                    card.innerHTML = `
                        <div class="w-16 text-center flex-shrink-0">
                            <div class="text-xl font-bold text-[#C8102E]">${scandal.year}</div>
                            <div class="flex justify-center mt-1">${createStars(scandal.severity)}</div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-x-3 flex-wrap">
                                <span class="font-bold text-lg group-hover:text-[#C8102E]">${scandal.title}</span>
                                <span class="text-xs px-2.5 py-0.5 rounded-full" style="background-color: ${scandal.partyColor}20; color: ${scandal.partyColor}">
                                    ${scandal.politicianName}
                                </span>
                            </div>
                            <div class="text-sm text-slate-600 mt-1 line-clamp-2">${scandal.shortDesc || ''}</div>
                        </div>
                        <div class="flex items-center text-slate-400 group-hover:text-[#C8102E]">
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    `;
                    list.appendChild(card);
                });

                yearSection.appendChild(list);
                container.appendChild(yearSection);
            });
        }

        // Start
        document.addEventListener('DOMContentLoaded', initTimelinePage);
    </script>

</body>
</html>
