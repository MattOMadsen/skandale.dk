<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netværk & Overlap | Skandale.dk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-50">

    <div class="max-w-7xl mx-auto px-6 pt-10 pb-6">
        <div class="flex items-center gap-x-3 mb-2">
            <div class="w-12 h-12 bg-[#C8102E] rounded-2xl flex items-center justify-center">
                <i class="fa-solid fa-globe text-white text-3xl"></i>
            </div>
            <div>
                <h1 class="text-4xl font-bold tracking-tight">Internationale Netværk & Overlap</h1>
                <p class="text-slate-600 mt-1">Klik på et netværk for at se tilknyttede politikere</p>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-6 pb-6">
        <div class="flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1 max-w-md">
                <i class="fa-solid fa-search absolute left-4 top-3 text-slate-400"></i>
                <input id="searchInput" type="text" placeholder="Søg efter netværk..." class="w-full pl-10 py-3 border rounded-2xl text-sm" oninput="filterNetworks()">
            </div>
            <div class="flex gap-2">
                <button onclick="showClassicOverview()" class="px-4 py-2.5 text-sm border rounded-2xl">Klassisk oversigt</button>
                <button onclick="resetView()" class="px-4 py-2.5 text-sm border rounded-2xl">Nulstil</button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-6 pb-12">
        <div id="loadingState" class="py-8 text-center text-slate-500">
            Indlæser netværksdata...
        </div>

        <div id="networksGrid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <div id="networkDetail" class="hidden mt-8 bg-white rounded-3xl border shadow-sm">
            <div class="px-6 py-5 border-b flex justify-between items-center">
                <div>
                    <h2 id="detailTitle" class="text-2xl font-bold"></h2>
                    <p id="detailSubtitle" class="text-sm text-slate-500"></p>
                </div>
                <button onclick="closeDetail()" class="text-3xl">&times;</button>
            </div>
            <div class="p-6">
                <div id="politiciansList" class="space-y-2 max-h-[420px] overflow-auto"></div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/modal-core.js"></script>
    <script src="js/modal-scandal.js"></script>
    <script src="js/modal-affiliations.js"></script>
    <script src="js/modal-network-overview.js"></script>
    <script src="js/modal-networks.js"></script>
    <script src="js/navbar.js"></script>

    <script>
        let allNetworks = [];

        async function loadNetworkData() {
            try {
                await loadPoliticians();
                await loadAllPoliticianDetails();

                const pols = window.politicians || [];
                const map = new Map();

                pols.forEach(p => {
                    (p.affiliations || []).forEach(aff => {
                        const name = String(aff.name || aff.organization || '').trim();
                        if (!name) return;
                        if (!map.has(name)) map.set(name, {name, politicians: []});
                        const entry = map.get(name);
                        if (!entry.politicians.some(x => x.id === p.id)) {
                            entry.politicians.push({id: p.id, name: p.name, party: p.party || '', year: aff.year || '', role: aff.role || ''});
                        }
                    });
                });

                allNetworks = Array.from(map.values()).sort((a,b) => b.politicians.length - a.politicians.length);

                renderCards();
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('networksGrid').classList.remove('hidden');
            } catch(e) {
                document.getElementById('loadingState').innerHTML = 'Fejl ved indlæsning af data.';
            }
        }

        function renderCards(filtered = null) {
            const grid = document.getElementById('networksGrid');
            grid.innerHTML = '';
            const list = filtered || allNetworks;

            list.forEach(net => {
                const card = document.createElement('div');
                card.className = 'bg-white border rounded-3xl p-6 cursor-pointer active:bg-red-50';
                card.dataset.name = net.name;
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-semibold text-xl">${net.name}</div>
                            <div class="text-xs mt-2 px-3 py-1 inline-block bg-slate-100 rounded-full">${net.politicians.length} politikere</div>
                        </div>
                        <div class="text-5xl font-bold text-[#C8102E]">${net.politicians.length}</div>
                    </div>
                `;
                grid.appendChild(card);
            });

            // Event delegation
            grid.onclick = (e) => {
                const card = e.target.closest('[data-name]');
                if (!card) return;

                const name = card.dataset.name;
                // Robust lookup
                let network = allNetworks.find(n => n.name === name);
                if (!network) {
                    // Fallback: case insensitive
                    network = allNetworks.find(n => n.name.toLowerCase() === name.toLowerCase());
                }

                if (network) {
                    showDetail(network, card);
                } else {
                    alert('Kunne ikke finde netværket: ' + name);
                }
            };
        }

        function filterNetworks() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allNetworks.filter(n => n.name.toLowerCase().includes(term));
            renderCards(filtered);
        }

        function showDetail(network, card) {
            document.querySelectorAll('[data-name]').forEach(c => c.classList.remove('border-[#C8102E]'));
            if (card) card.classList.add('border-[#C8102E]');

            document.getElementById('networkDetail').classList.remove('hidden');
            document.getElementById('detailTitle').textContent = network.name;
            document.getElementById('detailSubtitle').textContent = network.politicians.length + ' politikere har været tilknyttet';

            const list = document.getElementById('politiciansList');
            list.innerHTML = '';

            network.politicians.forEach(p => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between p-4 border rounded-2xl cursor-pointer active:bg-slate-100';
                row.dataset.id = p.id;

                row.innerHTML = `
                    <div class="flex gap-x-4">
                        <div class="w-10 h-10 bg-slate-200 rounded-2xl flex items-center justify-center font-semibold text-sm">${p.name.split(' ').map(n=>n[0]).join('').slice(0,2)}</div>
                        <div>
                            <div class="font-semibold">${p.name}</div>
                            <div class="text-sm text-slate-500">${p.party}</div>
                        </div>
                    </div>
                `;

                list.appendChild(row);
            });

            // Politiker klik
            list.onclick = (e) => {
                const row = e.target.closest('[data-id]');
                if (!row) return;
                const id = parseInt(row.dataset.id);
                if (id && typeof window.showPoliticianModal === 'function') {
                    window.showPoliticianModal(id);
                } else {
                    alert('showPoliticianModal ikke tilgængelig');
                }
            };
        }

        function closeDetail() {
            document.getElementById('networkDetail').classList.add('hidden');
            document.querySelectorAll('[data-name]').forEach(c => c.classList.remove('border-[#C8102E]'));
        }

        function resetView() {
            document.getElementById('searchInput').value = '';
            document.getElementById('networkDetail').classList.add('hidden');
            document.querySelectorAll('[data-name]').forEach(c => c.classList.remove('border-[#C8102E]'));
            renderCards();
        }

        function showClassicOverview() {
            if (typeof window.showNetworkOverviewModal === 'function') window.showNetworkOverviewModal();
        }

        document.addEventListener('DOMContentLoaded', loadNetworkData);
    </script>
</body>
</html>
