<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netværk & Overlap | Skandale.dk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <style>
        .network-card {
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .network-card:active {
            transform: scale(0.985);
            background-color: #fef2f2;
        }
        .politician-row:active {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="bg-slate-50">

    <!-- Header -->
    <div class="max-w-7xl mx-auto px-6 pt-10 pb-6">
        <div class="flex items-center gap-x-3 mb-2">
            <div class="w-12 h-12 bg-[#C8102E] rounded-2xl flex items-center justify-center">
                <i class="fa-solid fa-globe text-white text-3xl"></i>
            </div>
            <div>
                <h1 class="text-4xl font-bold tracking-tight">Internationale Netværk & Overlap</h1>
                <p class="text-slate-600 mt-1">Klik på et netværk for at se tilknyttede politikere</p>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="max-w-7xl mx-auto px-6 pb-6">
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="relative w-full sm:w-80">
                <i class="fa-solid fa-search absolute left-4 top-3 text-slate-400"></i>
                <input id="searchInput" type="text" placeholder="Søg efter netværk..." 
                       class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:border-[#C8102E]"
                       oninput="filterNetworks()">
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="showClassicOverview()" 
                        class="flex-1 sm:flex-none px-4 py-2.5 text-sm border border-slate-200 rounded-2xl flex items-center justify-center gap-x-2">
                    <i class="fa-solid fa-list-ul"></i>
                    <span>Klassisk oversigt</span>
                </button>
                <button onclick="resetView()" 
                        class="flex-1 sm:flex-none px-4 py-2.5 text-sm border border-slate-200 rounded-2xl flex items-center justify-center gap-x-2">
                    <i class="fa-solid fa-undo"></i>
                    <span>Nulstil</span>
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-6 pb-12">
        
        <!-- Loading -->
        <div id="loadingState" class="py-10 flex justify-center">
            <div class="flex items-center gap-x-2 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <span>Indlæser netværksdata...</span>
            </div>
        </div>

        <!-- Grid -->
        <div id="networksGrid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- JS injected cards -->
        </div>

        <!-- Detail view -->
        <div id="networkDetail" class="hidden mt-8 bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-6 py-5 border-b flex justify-between items-center bg-slate-50">
                <div>
                    <h2 id="detailTitle" class="text-2xl font-bold"></h2>
                    <p id="detailSubtitle" class="text-sm text-slate-500"></p>
                </div>
                <button onclick="closeDetail()" class="text-3xl text-slate-400 hover:text-slate-600">&times;</button>
            </div>

            <div class="p-6">
                <div class="flex justify-between items-center mb-3">
                    <div class="font-semibold">Politikere</div>
                    <div id="politicianCountBadge" class="text-xs px-3 py-1 bg-slate-100 rounded-full text-slate-600"></div>
                </div>

                <div id="politiciansList" class="space-y-2 max-h-[420px] overflow-auto">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/modal-core.js"></script>
    <script src="js/modal-scandal.js"></script>
    <script src="js/modal-affiliations.js"></script>
    <script src="js/modal-network-overview.js"></script>
    <script src="js/modal-networks.js"></script>
    <script src="js/navbar.js"></script>

    <script>
        let allNetworks = [];

        async function loadNetworkData() {
            try {
                await loadPoliticians();
                await loadAllPoliticianDetails();

                const pols = window.politicians || [];
                const map = new Map();

                pols.forEach(p => {
                    if (!p.affiliations || !Array.isArray(p.affiliations)) return;
                    p.affiliations.forEach(aff => {
                        const name = (aff.name || aff.organization || '').trim();
                        if (!name) return;

                        if (!map.has(name)) map.set(name, { name, politicians: [] });

                        const entry = map.get(name);
                        if (!entry.politicians.some(x => x.id === p.id)) {
                            entry.politicians.push({
                                id: p.id,
                                name: p.name,
                                party: p.party || '',
                                year: aff.year || '',
                                role: aff.role || ''
                            });
                        }
                    });
                });

                allNetworks = Array.from(map.values()).sort((a,b) => b.politicians.length - a.politicians.length);

                renderNetworkCards();
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('networksGrid').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                document.getElementById('loadingState').innerHTML = 
                    '<div class="text-center text-red-600">Kunne ikke indlæse data. Prøv at genindlæse siden.</div>';
            }
        }

        function renderNetworkCards(filteredNetworks = null) {
            const container = document.getElementById('networksGrid');
            container.innerHTML = '';

            const list = filteredNetworks || allNetworks;

            list.forEach(network => {
                const card = document.createElement('div');
                card.className = 'network-card bg-white border border-slate-200 rounded-3xl p-6 cursor-pointer active:bg-red-50';
                card.dataset.networkName = network.name;

                card.innerHTML = `
                    <div class="flex justify-between">
                        <div>
                            <div class="font-semibold text-xl tracking-tight">${network.name}</div>
                            <div class="mt-2 inline-block px-3 py-0.5 text-xs bg-slate-100 text-slate-600 rounded-full">
                                ${network.politicians.length} politikere
                            </div>
                        </div>
                        <div class="text-5xl font-bold text-[#C8102E]">${network.politicians.length}</div>
                    </div>
                `;

                container.appendChild(card);
            });

            // Event delegation - robust på mobil og desktop
            container.onclick = function(e) {
                const card = e.target.closest('.network-card');
                if (!card) return;

                const networkName = card.dataset.networkName;
                const network = allNetworks.find(n => n.name === networkName);
                if (network) {
                    showNetworkDetail(network, card);
                }
            };
        }

        function filterNetworks() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allNetworks.filter(n => n.name.toLowerCase().includes(term));
            renderNetworkCards(filtered);
        }

        function showNetworkDetail(network, activeCard) {
            // Reset active states
            document.querySelectorAll('.network-card').forEach(c => c.classList.remove('active', 'border-[#C8102E]'));
            if (activeCard) {
                activeCard.classList.add('active', 'border-[#C8102E]');
            }

            const detail = document.getElementById('networkDetail');
            detail.classList.remove('hidden');

            document.getElementById('detailTitle').textContent = network.name;
            document.getElementById('detailSubtitle').textContent = `${network.politicians.length} politikere har været tilknyttet`;
            document.getElementById('politicianCountBadge').textContent = `${network.politicians.length} politikere`;

            const listContainer = document.getElementById('politiciansList');
            listContainer.innerHTML = '';

            network.politicians.forEach(p => {
                const row = document.createElement('div');
                row.className = 'politician-row flex items-center justify-between p-4 border border-slate-100 rounded-2xl cursor-pointer';
                row.dataset.politicianId = p.id;

                row.innerHTML = `
                    <div class="flex items-center gap-x-4">
                        <div class="w-10 h-10 rounded-2xl bg-slate-200 flex items-center justify-center font-semibold text-sm">
                            ${p.name.split(' ').map(n=>n[0]).join('').slice(0,2)}
                        </div>
                        <div>
                            <div class="font-semibold">${p.name}</div>
                            <div class="text-sm text-slate-500">${p.party}</div>
                        </div>
                    </div>
                    <div class="text-right text-sm text-slate-500">
                        ${p.year || ''}
                    </div>
                `;

                listContainer.appendChild(row);
            });

            // Event delegation for politicians
            listContainer.onclick = function(e) {
                const row = e.target.closest('.politician-row');
                if (!row) return;

                const id = parseInt(row.dataset.politicianId);
                if (id && typeof window.showPoliticianModal === 'function') {
                    window.showPoliticianModal(id);
                } else {
                    alert('Kunne ikke åbne politikerens profil. Prøv at genindlæse siden.');
                }
            };
        }

        function closeDetail() {
            document.getElementById('networkDetail').classList.add('hidden');
            document.querySelectorAll('.network-card').forEach(c => c.classList.remove('active', 'border-[#C8102E]'));
        }

        function resetView() {
            document.getElementById('searchInput').value = '';
            document.getElementById('networkDetail').classList.add('hidden');
            document.querySelectorAll('.network-card').forEach(c => c.classList.remove('active', 'border-[#C8102E]'));
            renderNetworkCards();
        }

        function showClassicOverview() {
            if (typeof window.showNetworkOverviewModal === 'function') {
                window.showNetworkOverviewModal();
            }
        }

        document.addEventListener('DOMContentLoaded', loadNetworkData);
    </script>
</body>
</html>
