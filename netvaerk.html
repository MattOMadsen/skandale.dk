<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netværk & Overlap | Skandale.dk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <style>
        .network-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .network-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            border-color: #C8102E;
        }
        .network-card.active {
            border-color: #C8102E;
            background-color: #fef2f2;
        }
        .politician-row {
            transition: background-color 0.1s ease;
        }
        .politician-row:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- Navbar -->

    <!-- Header -->
    <div class="max-w-7xl mx-auto px-6 pt-10 pb-6">
        <div class="flex items-center gap-x-3 mb-2">
            <div class="w-12 h-12 bg-[#C8102E] rounded-2xl flex items-center justify-center">
                <i class="fa-solid fa-globe text-white text-3xl"></i>
            </div>
            <div>
                <h1 class="text-4xl font-bold tracking-tight">Internationale Netværk & Overlap</h1>
                <p class="text-slate-600 mt-1 text-lg">Klik på et netværk for at se hvilke politikere der har været tilknyttet det</p>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="max-w-7xl mx-auto px-6 pb-6">
        <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-search absolute left-4 top-3.5 text-slate-400"></i>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Søg efter netværk..." 
                    class="w-full pl-11 pr-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:border-[#C8102E] text-sm"
                    oninput="filterNetworks()">
            </div>
            
            <div class="flex items-center gap-x-3">
                <button 
                    onclick="showClassicOverview()"
                    class="flex items-center gap-x-2 px-4 py-2.5 text-sm font-medium border border-slate-200 hover:bg-white rounded-2xl transition-colors">
                    <i class="fa-solid fa-list-ul mr-1"></i>
                    <span class="hidden sm:inline">Klassisk oversigt</span>
                </button>
                <button 
                    onclick="resetView()"
                    class="flex items-center gap-x-2 px-4 py-2.5 text-sm font-medium border border-slate-200 hover:bg-white rounded-2xl transition-colors">
                    <i class="fa-solid fa-undo mr-1"></i>
                    <span>Nulstil</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-6 pb-16">
        
        <!-- Loading -->
        <div id="loadingState" class="flex items-center justify-center py-12">
            <div class="flex items-center gap-x-3 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-xl"></i>
                <span>Indlæser netværksdata...</span>
            </div>
        </div>

        <!-- Info text -->
        <div id="infoText" class="hidden mb-4 text-sm text-slate-500">
            Klik på et netværkskort nedenfor for at se de tilknyttede politikere.
        </div>

        <!-- Networks Grid -->
        <div id="networksGrid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- JS populated -->
        </div>

        <!-- Selected Network Detail -->
        <div id="networkDetail" class="hidden mt-8 bg-white border border-slate-200 rounded-3xl shadow-sm overflow-hidden">
            <div class="px-8 py-6 border-b flex items-center justify-between bg-slate-50">
                <div>
                    <h2 id="detailNetworkName" class="text-2xl font-bold tracking-tight"></h2>
                    <p id="detailNetworkCount" class="text-slate-500 mt-0.5"></p>
                </div>
                <button onclick="closeDetail()" class="text-3xl text-slate-400 hover:text-slate-600 leading-none">&times;</button>
            </div>
            
            <div class="p-8">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-semibold text-lg">Politikere med denne tilknytning</h3>
                    <span id="detailPoliticianCount" class="text-xs font-medium px-3 py-1 bg-slate-100 text-slate-600 rounded-full"></span>
                </div>
                
                <div id="politiciansList" class="space-y-2 max-h-[460px] overflow-y-auto pr-1">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/modal-core.js"></script>
    <script src="js/modal-scandal.js"></script>
    <script src="js/modal-affiliations.js"></script>
    <script src="js/modal-network-overview.js"></script>
    <script src="js/modal-networks.js"></script>
    <script src="js/navbar.js"></script>

    <script>
        let allNetworks = [];
        let currentNetwork = null;

        async function loadNetworkData() {
            try {
                await loadPoliticians();
                await loadAllPoliticianDetails();

                const politicians = window.politicians || [];
                const networkMap = new Map();

                politicians.forEach(politician => {
                    if (!politician.affiliations || !Array.isArray(politician.affiliations)) return;

                    politician.affiliations.forEach(aff => {
                        const rawName = (aff.name || aff.organization || '').trim();
                        if (!rawName) return;

                        if (!networkMap.has(rawName)) {
                            networkMap.set(rawName, { name: rawName, politicians: [] });
                        }

                        const entry = networkMap.get(rawName);
                        const exists = entry.politicians.some(p => p.id === politician.id);
                        if (!exists) {
                            entry.politicians.push({
                                id: politician.id,
                                name: politician.name,
                                party: politician.party || '',
                                year: aff.year || '',
                                role: aff.role || ''
                            });
                        }
                    });
                });

                allNetworks = Array.from(networkMap.values())
                    .sort((a, b) => b.politicians.length - a.politicians.length);

                renderNetworks(allNetworks);
                
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('networksGrid').classList.remove('hidden');
                document.getElementById('infoText').classList.remove('hidden');

            } catch (error) {
                console.error(error);
                document.getElementById('loadingState').innerHTML = `
                    <div class="text-center">
                        <p class="text-red-600">Kunne ikke indlæse data.</p>
                        <button onclick="location.reload()" class="mt-4 text-sm px-4 py-2 border rounded-2xl">Prøv igen</button>
                    </div>
                `;
            }
        }

        function renderNetworks(networksToShow) {
            const container = document.getElementById('networksGrid');
            container.innerHTML = '';

            if (!networksToShow.length) {
                container.innerHTML = `<p class="col-span-full text-center py-8 text-slate-500">Ingen netværk fundet.</p>`;
                return;
            }

            networksToShow.forEach(network => {
                const card = document.createElement('div');
                card.className = 'network-card bg-white border border-slate-200 rounded-3xl p-6 cursor-pointer';
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-1 pr-4">
                            <h3 class="font-semibold text-xl tracking-tight">${network.name}</h3>
                            <div class="mt-3">
                                <span class="inline-block px-3 py-1 text-xs font-medium bg-slate-100 text-slate-600 rounded-full">
                                    ${network.politicians.length} politikere
                                </span>
                            </div>
                        </div>
                        <div class="text-5xl font-bold text-[#C8102E] tabular-nums">${network.politicians.length}</div>
                    </div>
                `;

                // Robust click handler
                card.addEventListener('click', () => {
                    showNetworkDetail(network, card);
                });

                container.appendChild(card);
            });
        }

        function filterNetworks() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allNetworks.filter(n => n.name.toLowerCase().includes(term));
            renderNetworks(filtered);
        }

        function showNetworkDetail(network, activeCard) {
            // Deactivate all cards
            document.querySelectorAll('.network-card').forEach(c => c.classList.remove('active'));
            if (activeCard) activeCard.classList.add('active');

            currentNetwork = network;

            const detail = document.getElementById('networkDetail');
            detail.classList.remove('hidden');

            document.getElementById('detailNetworkName').textContent = network.name;
            document.getElementById('detailNetworkCount').textContent = `${network.politicians.length} politikere har været tilknyttet dette netværk`;
            document.getElementById('detailPoliticianCount').textContent = `${network.politicians.length} politikere`;

            const listEl = document.getElementById('politiciansList');
            listEl.innerHTML = '';

            network.politicians.forEach(politician => {
                const row = document.createElement('div');
                row.className = 'politician-row flex items-center justify-between p-4 border border-slate-100 rounded-2xl cursor-pointer hover:border-slate-200';

                row.innerHTML = `
                    <div class="flex items-center gap-x-4">
                        <div class="w-11 h-11 rounded-2xl bg-slate-200 flex-shrink-0 flex items-center justify-center font-semibold text-slate-600">
                            ${politician.name.split(' ').map(n => n[0]).join('').substring(0,2)}
                        </div>
                        <div>
                            <div class="font-semibold text-lg">${politician.name}</div>
                            <div class="text-sm text-slate-500">${politician.party}</div>
                        </div>
                    </div>
                    <div class="text-right text-sm text-slate-500">
                        ${politician.year || ''}
                        ${politician.role ? `<div class="text-xs mt-0.5">${politician.role}</div>` : ''}
                    </div>
                `;

                // Click handler for politician
                row.addEventListener('click', (e) => {
                    e.stopImmediatePropagation();
                    if (typeof window.showPoliticianModal === 'function') {
                        window.showPoliticianModal(politician.id);
                    } else {
                        console.warn('showPoliticianModal er ikke tilgængelig');
                        alert('Kunne ikke åbne politikerprofilen. Prøv at genindlæse siden.');
                    }
                });

                listEl.appendChild(row);
            });
        }

        function closeDetail() {
            document.getElementById('networkDetail').classList.add('hidden');
            document.querySelectorAll('.network-card').forEach(c => c.classList.remove('active'));
            currentNetwork = null;
        }

        function resetView() {
            document.getElementById('searchInput').value = '';
            document.getElementById('networkDetail').classList.add('hidden');
            document.querySelectorAll('.network-card').forEach(c => c.classList.remove('active'));
            renderNetworks(allNetworks);
        }

        function showClassicOverview() {
            if (typeof window.showNetworkOverviewModal === 'function') {
                window.showNetworkOverviewModal();
            } else {
                alert('Den klassiske modal-oversigt er ikke tilgængelig lige nu.');
            }
        }

        // Boot
        document.addEventListener('DOMContentLoaded', () => {
            loadNetworkData();
        });
    </script>
</body>
</html>
